<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frowdi Maps-style 3D Globe | Cesium</title>
    <meta name="description" content="A zoomable 3D globe (world to street level) built with CesiumJS, with clickable buildings." />
    <meta name="keywords" content="cesium, 3d globe, map, tiles, lod, javascript" />
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="./css/base.css">
    <script>document.documentElement.className = "js";</script>
  </head>

  <body class="demo-1">
    <canvas id="stars-bg" aria-hidden="true"></canvas>
    <script>
    (function () {
      'use strict';
      const canvas = document.getElementById('stars-bg');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const COLORS  = ['#FFFBF7', '#CCC7C2'];
      const N       = 800;
      const MOVE    = 38;
      const INERTIA = 0.052;

      let W, H, stars = [], meteors = [];
      let tx = 0, ty = 0, cx = 0, cy = 0;
      let inPage = true;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function mkStar() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r0: Math.random() * 1.25 + 0.22,
          col: COLORS[Math.random() < 0.62 ? 0 : 1],
          tp: Math.random() * Math.PI * 2,
          ts: 0.35 + Math.random() * 1.6,
          ta: 0.28 + Math.random() * 0.48,
          d: 0.22 + Math.random() * 0.78,
        };
      }

      function initStars() {
        stars = [];
        for (let i = 0; i < N; i++) stars.push(mkStar());
      }

      function drawBg() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#131A36');
        g.addColorStop(1, '#0F1631');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      let lastT = 0;
      function frame(now) {
        const dt = Math.min((now - lastT) / 1000, 0.05);
        lastT = now;

        const gx = inPage ? tx : 0;
        const gy = inPage ? ty : 0;
        cx += (gx - cx) * INERTIA;
        cy += (gy - cy) * INERTIA;

        drawBg();

        if (Math.random() < 0.003) {
          meteors.push({
            x: Math.random() * W * 0.75 + W * 0.1,
            y: Math.random() * H * 0.28,
            len: 80 + Math.random() * 140,
            speed: 380 + Math.random() * 320,
            angle: Math.PI / 4 + (Math.random() - 0.5) * 0.28,
            t: 0,
            life: 0.55 + Math.random() * 0.45,
          });
        }
        meteors = meteors.filter(function (m) {
          m.t += dt;
          if (m.t >= m.life) return false;
          const p   = m.t / m.life;
          const alp = p < 0.12 ? p / 0.12 : 1 - (p - 0.12) / 0.88;
          const ax  = Math.cos(m.angle);
          const ay  = Math.sin(m.angle);
          const hx  = m.x + ax * m.speed * m.t;
          const hy  = m.y + ay * m.speed * m.t;
          const tx2 = hx - ax * m.len;
          const ty2 = hy - ay * m.len;
          const g2  = ctx.createLinearGradient(tx2, ty2, hx, hy);
          g2.addColorStop(0, 'rgba(255,251,247,0)');
          g2.addColorStop(1, 'rgba(255,251,247,' + (alp * 0.72) + ')');
          ctx.beginPath();
          ctx.moveTo(tx2, ty2);
          ctx.lineTo(hx, hy);
          ctx.strokeStyle = g2;
          ctx.lineWidth   = 1.3;
          ctx.stroke();
          return true;
        });

        const t   = now / 1000;
        const vcx = W / 2;
        const vcy = H / 2;

        for (let i = 0; i < stars.length; i++) {
          const s  = stars[i];
          const tw = Math.sin(t * s.ts + s.tp);
          const r  = Math.max(0.1, s.r0 + tw * s.r0 * s.ta * 0.5);
          const a  = Math.max(0, Math.min(1, 0.52 + tw * s.ta * 0.48));

          const ndx        = (s.x - vcx) / vcx;
          const ndy        = (s.y - vcy) / vcy;
          const edgeFactor = Math.min(1.55, Math.sqrt(ndx * ndx + ndy * ndy));
          const strength   = s.d * (0.38 + edgeFactor * 0.92);

          const px = s.x + cx * strength;
          const py = s.y + cy * strength;

          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fillStyle   = s.col;
          ctx.globalAlpha = a;
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      document.addEventListener('mousemove', function (e) {
        inPage = true;
        tx = (e.clientX / W - 0.5) * 2 * MOVE;
        ty = (e.clientY / H - 0.5) * 2 * MOVE;
      });
      document.addEventListener('mouseleave', function () { inPage = false; });
      document.addEventListener('mouseenter', function () { inPage = true; });
      window.addEventListener('resize', function () { resize(); initStars(); });

      resize();
      initStars();
      requestAnimationFrame(frame);
    })();
    </script>
    <main>
      <div class="frame">
        <div class="frame__title-wrap">
          <h1 class="frame__title">Frowdi Maps-style 3D Globe</h1>
        </div>
      </div>
      <div class="content" id="root">
        <script type="module" src="./index.jsx"></script>
      </div>
    </main>
  </body>
</html>
